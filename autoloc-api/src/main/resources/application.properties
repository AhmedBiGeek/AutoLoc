spring.application.name=autoloc-api

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Mot de passe local : application-local.properties (non versionné).
# Les deux chemins couvrent un lancement depuis autoloc-api ou depuis la racine du projet.
spring.config.import=optional:file:./application-local.properties,optional:file:./autoloc-api/application-local.properties

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
